# Build Sofle firmware with ZMK's own reusable workflow.
#
# This lives in a dotfiles repo that gets pushed constantly for nvim and tmux
# work, and a Zephyr build is minutes, not seconds — hence the paths filter.
# Only a change under keyboard/ (or to this file) starts a build.
#
# ZMK's reusable workflow defaults to build.yaml + config/ at the repo root;
# build_matrix_path and config_path are what let this live in keyboard/
# instead of needing its own repository.
#
# config_path MUST be exactly one directory below the repo root. The workflow
# runs `west update` from the repo root, while `west init -l <dir>` puts the
# west workspace topdir at the PARENT of <dir> -- so a nested config_path like
# keyboard/config puts the workspace where west can no longer find it,
# and every job dies at West Update. build_matrix_path has no such constraint.
#
# Pinned to the same ZMK commit as keyboard/west.yml. Bump both
# together or the workflow and the source tree drift apart.

name: Sofle firmware

on:
  push:
    paths:
      - 'keyboard/**'
      # ...but not the parts that cannot change the firmware. Editing a README
      # or regenerating a diagram should not spend five minutes of Zephyr.
      - '!keyboard/README.md'
      - '!keyboard/keymap.svg'
      - '!keyboard/keymap.png'
      - '!keyboard/keymap.txt'
      - '!keyboard/keymap-drawer.yaml'
      - '!keyboard/scripts/**'
      - '.github/workflows/zmk-sofle.yml'
  pull_request:
    paths:
      - 'keyboard/**'
      # ...but not the parts that cannot change the firmware. Editing a README
      # or regenerating a diagram should not spend five minutes of Zephyr.
      - '!keyboard/README.md'
      - '!keyboard/keymap.svg'
      - '!keyboard/keymap.png'
      - '!keyboard/keymap.txt'
      - '!keyboard/keymap-drawer.yaml'
      - '!keyboard/scripts/**'
      - '.github/workflows/zmk-sofle.yml'
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@641514a97db345f499dd50b0360e594270f008fe
    with:
      build_matrix_path: keyboard/build.yaml
      config_path: keyboard
      archive_name: sofle-firmware
