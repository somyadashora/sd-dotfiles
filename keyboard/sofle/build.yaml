# Build matrix for the Parix Sofle MX (58 keys + 2 encoders, nice!nano v2).
#
# Stock ZMK `sofle` shield — the board is not a vendor fork, so nothing in
# this repo has to redefine the matrix, the physical layout, or the encoders.
#
# ZMK Studio is enabled on the LEFT half only. Left is the central side of the
# split; the peripheral has no keymap of its own to serve over RPC, and giving
# it the snippet just costs flash.
#
# settings_reset is a throwaway image: flash it to a half to wipe stored
# Bluetooth pairings and Studio-saved keymap changes, then immediately flash
# the real firmware back. It is the escape hatch for "the halves won't pair"
# and for "Studio state is overriding my .keymap".
include:
  - board: nice_nano_v2
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: sofle_right
  - board: nice_nano_v2
    shield: settings_reset
