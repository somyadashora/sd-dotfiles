unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-Space
set -g mouse on

# ============================================================================
# TMUX CHEATSHEET (prefix = Ctrl+Space)
# ============================================================================
# WINDOWS (tabs):
#   Ctrl+Space + c          - Create new window
#   Ctrl+Space + n          - Next window
#   Ctrl+Space + p          - Previous window
#   Ctrl+Space + j          - Next window
#   Ctrl+Space + k          - Previous window
#   Ctrl+Space + [0-9]      - Jump to specific window
#   Ctrl+Space + w          - List all windows (interactive)
#   Ctrl+Space + ,          - Rename window
#   Ctrl+Space + &          - Kill window
#
# PANES (splits):
#   Ctrl+Space + |          - Split pane vertically
#   Ctrl+Space + -          - Split pane horizontally
#   Alt + h/j/k/l           - Navigate panes (left/down/up/right)
#   Ctrl+Space + P          - Toggle a blank left margin in this window (wide monitors);
#                             single-pane windows only, width via @sd_pad_width (15%)
#   Ctrl+Space + s          - Toggle synchronized input (run commands on all panes)
#   Ctrl+Space + :          - Enter command mode
#   :setw synchronize-panes - Toggle synchronized input (manual command)
#
# SESSIONS (background/foreground):
#   Ctrl+Space + d          - Detach session (send to background)
#   tmux ls                 - List all sessions
#   tmux a -t name          - Attach to specific session
#   tmux attach             - Attach to last session
#   tmux new-session -s name - Create named session
#   tmux kill-session -t name - Kill specific session
#   tmux kill-server        - Kill all sessions
#
# TMUX-FZF (fuzzy finder for tmux):
#   Ctrl+Space + f          - Open tmux-fzf menu (sessions/windows/panes/commands)
#   Actions available in the menu:
#     - session: switch, kill, rename, detach
#     - window:  switch, kill, rename, swap, link
#     - pane:    switch, kill, swap, layout
#     - command: run any tmux command via fzf
#     - process: send signal to a pane's process
#
# COPY MODE (vim keybindings + system clipboard via tmux-yank):
#   Ctrl+Space + [          - Enter copy mode
#   q / Escape              - Exit copy mode
#   h/j/k/l                 - Navigate
#   w / b                   - Jump word forward / backward
#   /                       - Search forward
#   ?                       - Search backward
#   v                       - Begin selection
#   V                       - Select line
#   y                       - Yank selection to system clipboard and exit
#   Enter                   - Yank selection and exit
#   Y                       - Yank current line to system clipboard (normal mode)
#
# PASTE BUFFERS (clipboard history):
#   Ctrl+Space + =          - Native buffer list (Enter pastes via bracketed mode, d deletes)
#   Ctrl+Space + b          - fzf buffer picker → pastes in pane + copies to X CLIPBOARD
#
# POPUP TERMINAL:
#   Ctrl+Space + T          - Open popup shell in current pane's directory (q to close)
#
# g NAMESPACE (prefix + g + ...):
#   Ctrl+Space + g + f      - Open file under cursor in nvim
#   Ctrl+Space + g + d + f  - Run getdotfiles in popup (closes on exit)
#
# STATUS BAR:
#   Ctrl+Space + S          - Cycle status lines: 1 (primary) → 2 (+sys stats/SJC) → 3 (+UDR/AUS) → 1
#
# SAVE / RESTORE (tmux-resurrect + tmux-continuum):
#   Ctrl+Space + Ctrl+s     - Save sessions/windows/panes/layouts to disk
#   Ctrl+Space + Ctrl+r     - Restore last saved environment
#   (continuum also autosaves every 15 min and auto-restores on tmux start)
#
# OTHER:
#   Ctrl+Space + r          - Reload config
#   Ctrl+Space + ?          - Browse all keybindings with fzf
# ============================================================================

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# toggle synchronize-panes
bind s setw synchronize-panes

# next / previous window with prefix + j / k (vim-style)
bind j next-window
bind k previous-window

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set-option -g status-position top

# Terminal color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Inline images in nvim (image.nvim / diagram.nvim): let kitty-graphics escape
# sequences through to the outer terminal, and report focus so images hide in
# inactive panes. -q: older tmux (<3.3) doesn't know allow-passthrough — ignore
# rather than error on those machines. The ueberzugpp X11 backend needs neither.
set -gq allow-passthrough on
set -g focus-events on

# Keep DISPLAY updated when re-attaching so xclip/xsel can reach the X server (ETX)
set-option -g update-environment "DISPLAY"

# Catppuccin plugin configuration
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Pane counter discounts the left-margin pane (prefix+P / tmux-pad), so a padded
# single-pane window still reads as 1 pane instead of 2. The arithmetic is
# inlined rather than pulled into a helper option because these values are
# themselves expanded via #{E:...} inside catppuccin's status format, and a
# nested #{E:} would need a second expansion pass that never happens.
set -g @catppuccin_window_text " #W#{?#{>:#{e|-|:#{window_panes},#{?@sd_pad,1,0}},1}, [#{e|-|:#{window_panes},#{?@sd_pad,1,0}}#{?window_zoomed_flag,z,}],}"
set -g @catppuccin_window_current_text " #W#{?#{>:#{e|-|:#{window_panes},#{?@sd_pad,1,0}},1}, [#{e|-|:#{window_panes},#{?@sd_pad,1,0}}#{?window_zoomed_flag,z,}],}"

# Load catppuccin (must run before status line setup to make modules available)
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status bar
set -g status on

# Cycle status lines: 1 → 2 → 3 → 1 (prefix + S)
bind S run-shell 'case $(tmux show-option -gv status) in \
  2) tmux set -g status 3 ;; \
  3) tmux set -g status on; tmux set -g pane-border-status top ;; \
  *) tmux set -g status 2; tmux set -g pane-border-status off ;; \
esac'
set -g status-left-length 100
set -g status-right-length 150
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
# 󰅐 (nf-md-clock): the module's default 󰃰 calendar-clock is busy at status-bar
# size; the plain clock reads cleaner next to the rounded pill separator
set -g @catppuccin_date_time_icon "󰅐 "
set -g @catppuccin_date_time_text "BLR #($HOME/.config/tmux/scripts/tmux-tz-time Asia/Kolkata) #($HOME/.config/tmux/scripts/tmux-weather Bangalore)"

# Second status line (toggle with prefix+S): CPU load, disk usage, SJC time + weather
# @catppuccin_status_sjc mirrors catppuccin's status_module.conf format for date_time
set -g "@catppuccin_status_sjc" "#[fg=#{@thm_sapphire}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_sapphire}] 󰅐 #[fg=#{@thm_fg},bg=#{@thm_surface_0}]SJC #($HOME/.config/tmux/scripts/tmux-tz-time America/Los_Angeles) #($HOME/.config/tmux/scripts/tmux-weather SanJose) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -g "@catppuccin_status_cpuload" "#[fg=#{@thm_green}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_green}] 󰻠 #[fg=#{@thm_fg},bg=#{@thm_surface_0}]load #($HOME/.config/tmux/scripts/tmux-cpu) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -g "@catppuccin_status_raminfo" "#[fg=#{@thm_mauve}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_mauve}] 󰍛 #[fg=#{@thm_fg},bg=#{@thm_surface_0}]ram #($HOME/.config/tmux/scripts/tmux-ram) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -g "@catppuccin_status_disk" "#[fg=#{@thm_peach}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_peach}] 󰋊 #[fg=#{@thm_fg},bg=#{@thm_surface_0}]disk #($HOME/.config/tmux/scripts/tmux-disk) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -g "status-format[1]" "#[align=right]#{E:@catppuccin_status_disk}#{E:@catppuccin_status_raminfo}#{E:@catppuccin_status_cpuload}#{E:@catppuccin_status_sjc}"

# Third status line (cycle to with prefix+S twice): Udaipur + Austin time & weather
set -g "@catppuccin_status_udaipur" "#[fg=#{@thm_teal}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_teal}] 󰅐 #[fg=#{@thm_fg},bg=#{@thm_surface_0}]UDR #($HOME/.config/tmux/scripts/tmux-tz-time Asia/Kolkata) #($HOME/.config/tmux/scripts/tmux-weather Udaipur) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -g "@catppuccin_status_austin" "#[fg=#{@thm_flamingo}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_flamingo}] 󰅐 #[fg=#{@thm_fg},bg=#{@thm_surface_0}]AUS #($HOME/.config/tmux/scripts/tmux-tz-time America/Chicago) #($HOME/.config/tmux/scripts/tmux-weather Austin) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -g "status-format[2]" "#[align=right]#{E:@catppuccin_status_austin}#{E:@catppuccin_status_udaipur}"

# Panes — powerline-style: number badge → program name → its PID, active/inactive.
set -g pane-border-status top
# Left: the index/command pill, ending in the foreground process's PID (dim), so
# it reads "1/2 nvim 87629". tmux has no format var for the running program's pid
# (`pane_pid` is the pane's ROOT SHELL), so tmux-pane-pid resolves it from the
# tty — printing " <pid>", or nothing on error (pill degrades to the command
# name alone). Right (#[align=right], upper-right corner of the pane): a dim
# tty|PID segment (pts/N + shell PID — handy for tmux-watch, kill, strace), kept
# out of the pill to avoid information fatigue. Sequential single-attr #[..] tags
# only: multi-attr tags break inside #{?...} ternaries.
# The whole format is additionally wrapped in #{?@sd_pad_pane,,...}: the
# left-margin pane (prefix+P / tmux-pad) renders a completely blank border, so
# the margin reads as empty space rather than an extra labelled pane — and the
# discarded arm means tmux-pane-pid is never spawned for it. Index/count
# subtract that pane too, matching the window counter above.
set -g pane-border-format "#{?@sd_pad_pane,,#{?pane_active,#[fg=#1e1e2e]#[bg=#cba6f7]#[bold] #{e|-|:#{pane_index},#{?@sd_pad,1,0}}/#{e|-|:#{window_panes},#{?@sd_pad,1,0}} #[fg=#cba6f7]#[bg=#313244]#[nobold]#[fg=#cdd6f4]#[bg=#313244]#[bold] #{pane_current_command}#[nobold]#[fg=#7f849c]#($HOME/.config/tmux/scripts/tmux-pane-pid #{pane_tty}) #[fg=#313244]#[bg=default]#[nobold],#[fg=#cdd6f4]#[bg=#45475a]#[bold] #{e|-|:#{pane_index},#{?@sd_pad,1,0}}/#{e|-|:#{window_panes},#{?@sd_pad,1,0}} #[fg=#45475a]#[bg=default]#[nobold] #[fg=#6c7086]#{pane_current_command}#[fg=#585b70]#($HOME/.config/tmux/scripts/tmux-pane-pid #{pane_tty})#[default] }#[align=right]#{?pane_active,#[bg=#313244]#[fg=#9399b2] #{s|/dev/||:pane_tty} | PID: #{pane_pid} #[default],#[fg=#585b70]#{s|/dev/||:pane_tty} | PID: #{pane_pid} #[default]}}"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-style "fg=#45475a"

# Popup terminal in current pane's directory (prefix + T); t restored to clock-mode
bind t clock-mode
bind T display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "$SHELL"

# fzf keybinding browser (prefix + ?) — replaces default list-keys window
bind ? display-popup -w 90% -h 80% -E "tmux list-keys | fzf"

# Watch window (prefix + W): htop + ps --forest + vitals for the command
# running in / last fired from the CURRENT pane (tmux/scripts/tmux-watch).
# Re-invoking replaces the previous watch window; closing it never touches
# the watched job. Shell-side: watchlast / watchthis (see .bash_aliases).
bind W run-shell "$HOME/.config/tmux/scripts/tmux-watch --pane-pid #{pane_pid} --pane-tty #{pane_tty}"

# Left margin (prefix + P): pad the CURRENT window so the shell isn't glued to
# the far-left edge of a wide monitor. tmux has no real margin setting, so
# tmux-pad splits off a narrow, empty, tagged pane on the left; the tag is what
# keeps it out of the pane counter, blanks its border, and bounces focus back
# out of it. Per-window and single-pane-only -- it refuses on a window you've
# already split, since that's where you want every column. Width: @sd_pad_width
# (default 15%), or `tmux-pad on 30` for exact columns.
set -g @sd_pad_width "15%"
bind P run-shell "$HOME/.config/tmux/scripts/tmux-pad toggle"

# System monitor window (prefix + M): htop + RAM hogs + bottleneck vitals
# (load vs cores, PSI stall %, swap/iowait, D-state procs) for the WHOLE
# machine (tmux/scripts/tmux-sysmon). Re-invoking replaces the window.
# Shell-side: watchsys (see .bash_aliases).
bind M run-shell "$HOME/.config/tmux/scripts/tmux-sysmon"

# g key table namespace (prefix + g + ...)
bind g switch-client -T g_table
#   prefix + g + f   → open file under cursor in nvim
bind -T g_table f run-shell "TMUX_CX=#{cursor_x} TMUX_CY=#{cursor_y} TMUX_SCROLL=#{scroll_position} TMUX_DIR='#{pane_current_path}' $HOME/.config/tmux/scripts/tmux-open-file"
#   prefix + g + d + f → run getdotfiles in a popup
bind -T g_table d switch-client -T gd_table
bind -T gd_table f display-popup -w 80% -h 80% -E "$HOME/.config/tmux/scripts/tmux-getdotfiles"

# word-separators: whitespace only so W/select-word treats full paths as one word
setw -g word-separators ' \t'

# Add vi copy-mode bindings here
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "python3.6 $HOME/.config/nvim/scripts/nvim-clip copy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "python3.6 $HOME/.config/nvim/scripts/nvim-clip copy"

# gf in copy mode: cursor anywhere on filename, press 'o' — uses #{copy_cursor_word} to avoid capture-pane scroll mismatch
bind-key -T copy-mode-vi o run-shell "TMUX_CX=#{copy_cursor_x} TMUX_CY=#{copy_cursor_y} TMUX_SCROLL=#{scroll_position} $HOME/.config/tmux/scripts/tmux-open-file" \; send-keys -X cancel


# Browse tmux paste buffer history with fzf (prefix + b)
# Pastes via bracketed paste mode (-p) to avoid ETX character dropping,
# and also copies to X CLIPBOARD so Windows paste (Ctrl+V) works too.
bind-key b run-shell -b 'sel=$(tmux list-buffers | fzf-tmux -p 80% --reverse --preview "tmux show-buffer -b \$(echo {} | cut -d: -f1)" --preview-window "right:60%:wrap"); [ -n "$sel" ] && { buf=$(echo "$sel" | cut -d: -f1); tmux show-buffer -b "$buf" | python3.6 $HOME/.config/nvim/scripts/nvim-clip copy; $HOME/.config/tmux/scripts/tmux-paste "$buf"; }'

# Override = (choose-buffer): paste without trailing newline so shell does not auto-execute
bind-key = choose-buffer "run-shell \"$HOME/.config/tmux/scripts/tmux-paste '%%'\""

# Line numbers in copy mode — vim-style relativenumber in a narrow left pane
# (cursor line = absolute number, others = their j/k distance). Added in
# 58fcb0c, accidentally dropped in 74ee1df ("remove second status line");
# restored with theme-matched colors: mauve current line (the repo accent),
# overlay-gray others. Needs tmux 3.2+ (pane-mode-changed hook).
set -g @plugin 'JosephLai241/tmux-line-numbers'
# Gutter contrast is self-contained (explicit dark bg + light fg pairs, like
# the status bar), so the numbers stay legible on ANY terminal colorscheme —
# light or dark — instead of inheriting whatever bg the pane happens to have.
# Palette: catppuccin mocha, matching the (scheme-fixed) tmux theme: mauve
# accent + surface1 pill for the cursor line, overlay2 on crust for the rest.
set -g @line-numbers-current-line-fg '#cba6f7'
set -g @line-numbers-current-line-bg '#45475a'
set -g @line-numbers-current-line-bold on
set -g @line-numbers-fg '#9399b2'
set -g @line-numbers-bg '#1e1e2e'

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'
set-environment -g TMUX_FZF_LAUNCH_KEY "f"

# Session save/restore: resurrect (manual: prefix+C-s save, prefix+C-r restore)
# + continuum (autosave every 15 min, auto-restore on tmux server start)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
# (no @resurrect-processes needed: nvim/vim/htop are in resurrect's default
# restore list, and setting the option would REPLACE that list, not extend it)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX Plugin Manager (keep this at the bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'


