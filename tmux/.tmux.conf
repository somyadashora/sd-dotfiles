unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-Space
set -g mouse on

# ============================================================================
# TMUX CHEATSHEET (prefix = Ctrl+Space)
# ============================================================================
# WINDOWS (tabs):
#   Ctrl+Space + c          - Create new window
#   Ctrl+Space + n          - Next window
#   Ctrl+Space + p          - Previous window
#   Ctrl+Space + [0-9]      - Jump to specific window
#   Ctrl+Space + w          - List all windows (interactive)
#   Ctrl+Space + ,          - Rename window
#   Ctrl+Space + &          - Kill window
#
# PANES (splits):
#   Ctrl+Space + |          - Split pane vertically
#   Ctrl+Space + -          - Split pane horizontally
#   Alt + h/j/k/l           - Navigate panes (left/down/up/right)
#   Ctrl+Space + s          - Toggle synchronized input (run commands on all panes)
#   Ctrl+Space + :          - Enter command mode
#   :setw synchronize-panes - Toggle synchronized input (manual command)
#
# SESSIONS (background/foreground):
#   Ctrl+Space + d          - Detach session (send to background)
#   tmux ls                 - List all sessions
#   tmux a -t name          - Attach to specific session
#   tmux attach             - Attach to last session
#   tmux new-session -s name - Create named session
#   tmux kill-session -t name - Kill specific session
#   tmux kill-server        - Kill all sessions
#
# TMUX-FZF (fuzzy finder for tmux):
#   Ctrl+Space + f          - Open tmux-fzf menu (sessions/windows/panes/commands)
#   Actions available in the menu:
#     - session: switch, kill, rename, detach
#     - window:  switch, kill, rename, swap, link
#     - pane:    switch, kill, swap, layout
#     - command: run any tmux command via fzf
#     - process: send signal to a pane's process
#
# OTHER:
#   Ctrl+Space + r          - Reload config
#   Ctrl+Space + ?          - Show all keybindings
# ============================================================================

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# toggle synchronize-panes
bind s setw synchronize-panes

set-option -g status-position top

# Terminal color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Catppuccin plugin configuration
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load catppuccin (must run before status line setup to make modules available)
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status bar
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text "%H:%M %d-%b-%y"

# Panes (catppuccin handles pane colors, but keep border format)
set -g pane-border-status top
set -g pane-border-format "#{pane_current_command} - #{pane_pid}"

# Add vi copy-mode bindings here
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel


set -g @plugin 'JosephLai241/tmux-line-numbers'
set -g @plugin 'sainnhe/tmux-fzf'
set-environment -g TMUX_FZF_LAUNCH_KEY "f"

# Initialize TMUX Plugin Manager (keep this at the bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

